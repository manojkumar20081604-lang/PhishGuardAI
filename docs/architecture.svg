<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="540" fill="#f8fafc"/>
  <text x="480" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#1e293b">PhishGuard AI — Local-First Architecture</text>
  <text x="480" y="72" text-anchor="middle" font-size="13" fill="#64748b">The AI brain lives INSIDE the browser. Zero data leaves the device.</text>

  <!-- Browser box -->
  <rect x="60" y="100" width="840" height="330" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="84" y="130" font-size="15" font-weight="700" fill="#334155">Browser Extension (Manifest V3)</text>

  <!-- Entry points -->
  <g font-size="13" fill="#334155" text-anchor="middle">
    <rect x="90" y="150" width="150" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="165" y="173" font-weight="600">Popup</text>
    <text x="165" y="192" font-size="11" fill="#64748b">URL + Message scan</text>

    <rect x="90" y="222" width="150" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="165" y="245" font-weight="600">Auto-Protect</text>
    <text x="165" y="264" font-size="11" fill="#64748b">banners on visit</text>

    <rect x="90" y="294" width="150" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
    <text x="165" y="317" font-weight="600">Right-click / Hotkey</text>
    <text x="165" y="336" font-size="11" fill="#64748b">scan without visiting</text>
  </g>

  <!-- Pipeline -->
  <g font-size="12" text-anchor="middle">
    <line x1="240" y1="247" x2="290" y2="247" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="292" y="222" width="140" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="362" y="243" font-weight="600" fill="#14532d">Trust Lists</text>
    <text x="362" y="260" font-size="10.5" fill="#4ade80">🤍 allow · 🖤 block</text>

    <line x1="432" y1="247" x2="482" y2="247" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="484" y="222" width="120" height="50" rx="8" fill="#fefce8" stroke="#eab308"/>
    <text x="544" y="243" font-weight="600" fill="#713f12">Cache</text>
    <text x="544" y="260" font-size="10.5" fill="#a16207">IndexedDB</text>

    <line x1="604" y1="247" x2="654" y2="247" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="656" y="160" width="216" height="220" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="764" y="186" font-size="14" font-weight="700" fill="#581c87">LOCAL AI ENGINE</text>
    <text x="764" y="212" font-size="12" fill="#6b21a8">url-model-v3.onnx</text>
    <text x="764" y="228" font-size="10.5" fill="#9333ea">(GradientBoosting, bundled)</text>
    <g font-size="11.5" fill="#6b21a8">
      <text x="764" y="254">• 10-feature URL extraction</text>
      <text x="764" y="272">• Homoglyph/punycode guard</text>
      <text x="764" y="290">• Risk fusion + XAI reasons</text>
      <text x="764" y="308">• Email/SMS text rules</text>
      <text x="764" y="326">• Brand-safety gate (58 domains)</text>
      <text x="764" y="352" font-weight="700" fill="#14532d">⚡ ~milliseconds · works offline</text>
    </g>
  </g>

  <!-- Verdicts -->
  <g font-size="12" text-anchor="middle">
    <line x1="764" y1="380" x2="764" y2="404" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
    <rect x="544" y="406" width="110" height="34" rx="17" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="599" y="427" fill="#166534" font-weight="700">SAFE 🟢</text>
    <rect x="668" y="406" width="110" height="34" rx="17" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="723" y="427" fill="#92400e" font-weight="700">SUSPICIOUS 🟡</text>
    <rect x="792" y="406" width="110" height="34" rx="17" fill="#fef2f2" stroke="#ef4444"/>
    <text x="847" y="427" fill="#991b1b" font-weight="700">PHISHING 🔴</text>
  </g>

  <!-- Optional backend -->
  <g font-size="12" text-anchor="middle">
    <rect x="292" y="300" width="140" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="362" y="321" fill="#475569">Flask enrichment</text>
    <text x="362" y="338" font-size="10.5" fill="#94a3b8">OPTIONAL · off by default</text>
    <line x1="362" y1="298" x2="362" y2="274" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>
</svg>
